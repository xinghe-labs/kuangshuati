name: iOS Build Check

# 在真实 Xcode 工具链上编译 iOS，并额外产出一个「未签名 ipa」。
# 两个目的：
# 1. 让 Swift 代码（尤其 ios/Runner/KuangshuatiChannels.swift）过一遍编译，
#    避免长期处于「从未编译」状态；
# 2. 给「没有 Mac、只自己 iPhone 用」的场景提供可侧载的包 —— 未签名 ipa
#    不能直接安装，需要用 Sideloadly 以 Apple ID 重签后安装
#    （免费证书 7 天有效，到期重签即可，App 内数据不受影响）。
# 这里不产出可上架的签名包：那需要 Apple Developer 证书与 provisioning profile。
on:
  workflow_dispatch:
  # 发版时创建 Release（带 APK）会触发一次，把 ipa 补进同一个 Release。
  release:
    types: [published]
  push:
    paths:
      - "app/ios/**"
      - "app/lib/**"
      - "app/pubspec.yaml"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    # 顶层只读；把 ipa 传到 Release 需要写权限，只给这个 job。
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.44.1
        run: |
          git clone --depth 1 --branch 3.44.1 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Report toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # 版本号的唯一来源是 app/pubspec.yaml 的 `version: 1.1.2+12`，
      # 与 Android 产物（kuangshuati-1.1.2-12.apk）命名保持一致。
      - name: Resolve app version
        id: version
        working-directory: app
        run: |
          set -euo pipefail
          raw=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          name="${raw%%+*}"
          build="${raw##*+}"
          if [ -z "$name" ] || [ -z "$build" ] || [ "$name" = "$build" ]; then
            echo "无法从 pubspec.yaml 解析出版本号（需要 版本+build 形式），原始值：'$raw'"
            exit 1
          fi
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "解析到版本 $name+$build"

      - name: Analyze Dart
        working-directory: app
        run: flutter analyze

      # --no-codesign 跳过签名；iOS 没有 Mac 时这是唯一可行的验证方式。
      # 构建失败会以非零退出码结束，Swift 编译错误会直接出现在日志里。
      - name: Build iOS (no codesign)
        working-directory: app
        run: |
          # iOS 的「发现新版本」提示要读这份清单（Android 发版时同步更新）。
          # 清单地址是公开的，不含密钥，所以直接写在构建参数里。
          flutter build ios --release --no-codesign             --dart-define=UPDATE_MANIFEST_URL=https://kuangshuati.124145.xyz/update-manifest.json

      - name: Verify the app bundle was produced
        working-directory: app
        run: |
          app_path="build/ios/iphoneos/Runner.app"
          test -d "$app_path" || {
            echo "未生成 $app_path"
            exit 1
          }
          ls -la "$app_path" | head -20
          # 确认我们自己的 Swift 通道类真的被编进了二进制，
          # 否则 pbxproj 注册漏了也能「构建成功」。
          binary="$app_path/Runner"
          test -f "$binary"
          # MethodChannel 名字是字符串常量，一定在二进制里。
          strings "$binary" | grep -q "com.kuangshuati.app/backup" || {
            echo "错误：二进制中缺少 backup 通道名，Swift 代码未生效"
            exit 1
          }
          echo "OK: backup 通道已编译进 Runner 二进制"

      # 打成未签名 ipa（Payload/Runner.app 的 zip）。签名不在这里做：
      # 侧载工具会用自己的 Apple ID 重新签名。
      - name: Package unsigned ipa
        working-directory: app
        env:
          FILE_TAG: ${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          ipa="kuangshuati-${FILE_TAG}-unsigned.ipa"
          mkdir -p Payload
          cp -R Runner.app Payload/
          # 侧载工具按 ipa 结构识别，必须是 Payload/Runner.app 这一层。
          rm -f "$ipa"
          # -y 保留 Flutter.framework 内部的符号链接，侧载工具重签依赖它们。
          zip -qry "$ipa" Payload
          ls -lh "$ipa"
          # 用 sed 而不是 head：pipefail 下 head 提前关闭管道会让 unzip 吃 SIGPIPE。
          unzip -l "$ipa" | sed -n '1,20p'
          test -f "$ipa"

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}
          path: app/build/ios/iphoneos/kuangshuati-*-unsigned.ipa
          if-no-files-found: error
          # 包内不含题库（题库首次启动时下载），体积小，留 30 天够重装几轮。
          retention-days: 30

      # ipa 和 APK 放同一个版本 Release：用户在一处就能拿到两端安装包。
      # 版本 Release 由发版流程创建（带 APK），CI 只往里补 ipa，不自己建 ——
      # 否则发版时网页上会撞「该 tag 的 release 已存在」。
      - name: Publish ipa to release
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          IPA_PATH: build/ios/iphoneos/kuangshuati-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}-unsigned.ipa
        run: |
          set -euo pipefail
          # release 事件用它的 tag；push 事件按版本号推 v<版本>。
          tag="${RELEASE_TAG:-v${VERSION_NAME}}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag 还不存在，跳过上传 ipa（等发版建好 Release 后，本 workflow 会自动补上）"
            exit 0
          fi
          # 同名附件覆盖，重跑不堆重复文件。
          gh release upload "$tag" "$IPA_PATH" --clobber
          # 变量名紧跟中文全角标点时必需 braces：macOS 的 bash 3.2 会把
          # 「全角冒号」当成变量名的一部分，$tag： 会解析成变量 tag：→ set -u 报错。
          echo "已上传到 Release ${tag}："
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name)  \(.size) B"'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            app/build/ios/**/*.log
            app/ios/Pods/**/*.log
          if-no-files-found: ignore
          retention-days: 7
