name: CI

# 静态分析 + 单元/组件测试。
# 依赖真实题库的集成测试在拿不到题库分片时会自动 markTestSkipped，
# 所以这个工作流不需要任何私有资源或密钥就能跑绿。

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # drift/sqlite3 的测试在 Dart VM 里加载系统 libsqlite3。
      - name: Install system sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
